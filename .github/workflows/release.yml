name: Build and publish TradeDesk

on:
  push:
    branches: [feature/bootstrapper]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tradedesk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build release
        run: npm run build:release
      - name: Run tests
        run: npm test
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TradeDesk-${{ env.RELEASE_VERSION }}
          path: |
            dist/TradeDeskBootstrap.exe
            dist/TradeDesk-win-x64.zip
            dist/latest.json
            dist/release-notes-*.md
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$env:RELEASE_VERSION" dist/TradeDeskBootstrap.exe dist/TradeDesk-win-x64.zip dist/latest.json --target "$env:GITHUB_SHA" --title "TradeDesk $env:RELEASE_VERSION" --notes-file "dist/release-notes-$env:RELEASE_VERSION.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are not overwritten.' }
